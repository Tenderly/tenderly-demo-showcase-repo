# Runs example 04 on every pull request. It creates an environment and runs example 02's suite against it.
# Repo settings: secret TENDERLY_ACCESS_KEY, variables TENDERLY_ACCOUNT_NAME and TENDERLY_PROJECT_NAME.
# The environment stays up after the job, and the job summary links to it (login to the Tenderly project needed).
name: Virtual Environment CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement:
    # Skips until the repo variables exist, and skips pull requests from forks, which get no secrets.
    if: vars.TENDERLY_ACCOUNT_NAME != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
        working-directory: examples/setup-examples/02-automation-tests

      - run: npm ci
        working-directory: examples/setup-examples/04-ci-cd

      - name: Create an environment and run example 02's suite
        run: npm run ci -- --pr ${{ github.event.pull_request.number || github.run_number }}
        working-directory: examples/setup-examples/04-ci-cd
        env:
          TENDERLY_ACCESS_KEY: ${{ secrets.TENDERLY_ACCESS_KEY }}
          TENDERLY_ACCOUNT: ${{ vars.TENDERLY_ACCOUNT_NAME }}
          TENDERLY_PROJECT: ${{ vars.TENDERLY_PROJECT_NAME }}
